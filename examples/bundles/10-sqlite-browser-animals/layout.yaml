  - id: history-measurements
    type: history
    data:
      label: Measured Failure and Fix
      items:
        - year: "198.92 MB"
          event: "Full Glazed static export database size. Cross-reference tables dominated the file."
        - year: "6,074,525"
          event: "commit_refs rows. The reference graph was large enough to expose a bad hot-path query."
        - year: "60.285s"
          event: "Native SQLite time for the old snapshot_refs count on one source file."
        - year: "0.009s"
          event: "Native SQLite time after constraining commit and file before expanding locations_json."
        - year: "19ms"
          event: "Browser sql.js source-reference query after the rewrite."
  - id: did-sqlite-rules
    type: did
    data:
      label: Field Rules
      items:
        - "Measure native SQLite first. If native SQLite takes a minute, WebAssembly is not the root cause."
        - "Do not trust compatibility views on hot source/xref paths. Views are convenient interfaces, not guaranteed performance boundaries."
        - "Constrain by commit and stable file identity before expanding JSON with json_each."
        - "Keep provider result shapes stable so React components do not know whether the SQL came from a view or normalized tables."
