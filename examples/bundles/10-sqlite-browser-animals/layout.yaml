  - id: word-hot-path
    type: word
    data:
      label: Core Term
      word: Query Shape
      phonetic: kweer-ee shayp
      part: noun
      definition: "The operational structure SQLite must execute: joins, filters, view expansion, JSON iteration, temp B-trees, and result ordering."
      example: "In browser-side SQLite, query shape is UI behavior because synchronous sql.js stepping can block paint and input."
