      fit: contain
      border: false
      grayscale: true
  - id: plan-source-path
    type: plan
    data:
      label: Source Page Data Path
      items:
        - time: "route"
          text: "SourcePage asks for source text, refs, index data, and file xrefs."
          done: false
        - time: "cheap"
          text: "Raw source bytes load by content hash from file_contents."
          done: false
        - time: "hot"
          text: "Reference lookup uses commit_refs, ref_versions, files, symbols, and locations_json."
          done: false
        - time: "bad"
          text: "snapshot_refs expanded the broad reference space before the file-level answer emerged."
          done: false
        - time: "fix"
          text: "The new query filters latest commit and file first, then expands only matching JSON locations."
          done: false
  - id: note-worker
    type: note
    data:
      label: Worker Layer
      text: "The SQL rewrite fixes query latency. The Worker layer fixes responsiveness boundaries: SQLite stepping moves off the main thread while RTK Query keeps the same provider contract."
      author: Codebase Browser GCB-022
