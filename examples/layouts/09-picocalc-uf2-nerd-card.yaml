  - id: word-vector-hole
    type: word
    data:
      label: Nerd Word
      word: Vector Hole
      phonetic: vek-tor hohl
      part: noun
      definition: "A small gap at RP2040 flash offset 0x110 where uf2loader stores proginfo: magic, safe flash end, and the currently installed app name."
      example: "If the magic at XIP_BASE + 0x110 is valid, stage3 knows the app can be launched."
  - id: divider-picocalc-1
    type: divider
    data:
      style: dots
  - id: plan-boot-keys
    type: plan
    data:
      label: Power-On Decision Tree
      items:
        - time: "0ms"
          text: Reset lands in tiny stage3 bootloader in Pico flash.
          done: false
        - time: "500ms"
          text: "Scan PicoCalc keyboard: Up/F1/F5 means SD menu."
          done: false
        - time: "default"
          text: "No key: set VTOR, set MSP, branch to installed app reset vector."
          done: false
        - time: "menu"
          text: Load BOOT2040.UF2 from SD into SRAM and jump there.
          done: false
        - time: "select"
          text: Menu flashes normal .uf2 from /pico1-apps/ and reboots.
          done: false
  - id: did-picocalc-uf2
    type: did
    data:
      label: Why This Beats /firmware/*.bin
      items:
        - "Stock Bootloader v1.0 wants a specially linked .bin whose first words are stack pointer + reset vector at the 200 KiB app offset."
        - "UF2-to-BIN conversion failed because normal Pico images start with boot2 bytes, not the vector table the stock loader validates."
        - "uf2loader accepts ordinary Arduino/Pico .uf2 apps, preserves its high-flash loader region, and keeps the big menu on SD."
        - "BOOT2040.UF2 is not flashed as firmware; it is the menu UI loaded from SD into RAM."
  - id: history-addresses
    type: history
    data:
      label: Magic Addresses
      items:
        - year: "0x10000000"
          event: "XIP flash base on RP2040. Normal images begin with boot2 here."
        - year: "0x10000100"
          event: "Application vector table after boot2; stage3 jumps here for installed apps."
        - year: "0x10000110"
          event: "Vector-table hole used for uf2loader proginfo metadata."
        - year: "top 16 KiB"
          event: "Protected high-flash area: 8 KiB stage3 plus 8 KiB reserved BT-stack space."
  - id: quote-picocalc-uf2
    type: quote
    data:
      label: Loader Maxim
      text: "Do not flash BOOT2040.UF2 to the Pico. Put it on the SD card. Flash bootloader_pico.uf2 once, then feed the menu ordinary .uf2 apps."
      author: "PicoCalc field rule"
  - id: note-picocalc-uf2
    type: note
    data:
      label: SD Card Spell
      text: "/BOOT2040.UF2 + /pico1-apps/uLisp_4.8f_arduino_pico_4.5.0.uf2. Hold Up, F1, or F5 on power-up. Select the app. Reboot into Lisp."
      author: "two-stage incantation"
