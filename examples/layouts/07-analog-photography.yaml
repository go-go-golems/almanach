      text: f/22 at 1/4 sec on Tri-X. Reciprocity failure kicked in at 1 second — added one stop. The bellows extension factor on the 210mm at close focus costs another 1.5 stops. Meter reads EV 8 but you'll need EV 5.5 after corrections. Write it on the film holder.
