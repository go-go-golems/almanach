  - id: did-film
    type: did
    data:
      label: Large Format Lore
      items:
        - An 8×10 sheet of Tri-X has roughly 500 megapixels of resolution when drum-scanned — every grain is a pixel of truth.
        - Ansel Adams hiked Yosemite with a 60-pound pack containing his 8×10 view camera, three lenses, and a dozen film holders.
        - The Movielab 70mm IMAX format uses 15-perforation film — each frame is roughly the size of a postcard.
        - A standard 4×5 film holder carries two sheets — one per side. You get two chances before you reload.
  - id: quote-film
    type: quote
    data:
      label: From the Darkroom
      text: You don't take a photograph, you make it. The negative is the score, the print is the performance.
      author: Ansel Adams
