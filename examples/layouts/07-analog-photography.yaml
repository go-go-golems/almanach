      label: Word of the Day
      word: Chiaroscuro
      phonetic: ki-ä-ro-skü-ro
      part: noun
      definition: The treatment of light and shade in drawing and painting; the strong contrast between light and dark that gives a sense of volume and drama to a photograph.
      example: The large format portrait was a study in chiaroscuro — window light falling across the sitter's face as the darkroom faded to black.
  - id: history-film
    type: history
    data:
      label: Milestones in Film
      items:
        - year: "1839"
          event: Louis Daguerre presents the daguerreotype to the French Academy of Sciences — the first practical photographic process.
        - year: "1888"
          event: George Eastman introduces the Kodak No. 1 camera with the slogan "You press the button, we do the rest."
        - year: "1948"
          event: Ansel Adams publishes "The Negative," codifying the Zone System for precise exposure control in large format.
        - year: "2013"
          event: Kodak files for bankruptcy. Fujifilm discontinues FP-100C — the last instant peel-apart film.
