name: golang-pipeline

on:
  push:
    branches:
      - 'main'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - run: git fetch --force --tags
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify logcopter package loggers
        run: make logcopter-check
      - name: Verify Glazed CLI policy
        run: make glazed-lint
      - name: Install generation tools
        run: |
          go install github.com/bufbuild/buf/cmd/buf@v1.60.0
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
      - name: Enable pnpm for web generation
        run: corepack enable && corepack prepare pnpm@10.15.0 --activate
      - name: Generate assets
        run: BUILD_WEB_LOCAL=1 go generate ./...
      - name: Verify generated files are up to date
        run: git diff --exit-code
      - name: Run unit tests
        run: go test ./...
